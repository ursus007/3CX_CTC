<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRM Cobranzas - NXAI</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #1e1e1e;
      color: #f5f5f5;
      margin: 0;
      padding: 20px;
    }
    .container {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }
    .panel {
      background-color: #2d2d2d;
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }
    h2, h3 {
      margin-top: 0;
      color: #00adb5;
      border-bottom: 1px solid #3a3a3a;
      padding-bottom: 8px;
    }
    .flex-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .refresh-btn {
      background: none;
      border: none;
      font-size: 20px;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .refresh-btn:hover {
      transform: rotate(180deg);
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
      font-size: 14px;
      color: #aaaaaa;
    }
    input[type="text"], input[type="date"], select {
      width: 100%;
      padding: 10px;
      background-color: #3a3a3a;
      border: 1px solid #555;
      border-radius: 4px;
      color: #fff;
      box-sizing: border-box;
    }
    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 4px;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      margin-bottom: 10px;
    }
    .btn-call { background-color: #28a745; color: white; }
    .btn-save { background-color: #00adb5; color: white; }
    .agent-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px;
      background-color: #3a3a3a;
      margin-bottom: 8px;
      border-radius: 4px;
    }
    .badge {
      padding: 4px 8px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: bold;
    }
    .bg-available { background-color: #2d6a4f; color: #d8f3dc; }
    .bg-oncall { background-color: #8338ec; color: #f1e4ff; }
    .bg-away { background-color: #d68c45; color: #fff3e3; }
    .bg-offline { background-color: #4a4a4a; color: #ccc; }
    
    .cajon-tipificacion {
      background-color: #333a42;
      border: 2px solid #00adb5;
      border-radius: 8px;
      padding: 15px;
      margin-top: 15px;
    }

    /* Estilos para la tabla de Historial */
    .historial-panel {
      margin-top: 20px;
      background-color: #252525;
      padding: 15px;
      border-radius: 6px;
      border: 1px solid #3a3a3a;
    }
    .historial-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      font-size: 14px;
    }
    .historial-table th, .historial-table td {
      padding: 8px;
      text-align: left;
      border-bottom: 1px solid #3a3a3a;
    }
    .historial-table th {
      color: #00adb5;
      font-weight: bold;
    }
    
    /* Toggle Switch */
    .switch {
      position: relative;
      display: inline-block;
      width: 50px;
      height: 24px;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
      background-color: #ccc; transition: .4s; border-radius: 24px;
    }
    .slider:before {
      position: absolute; content: ""; height: 16px; width: 16px; left: 4px; bottom: 4px;
      background-color: white; transition: .4s; border-radius: 50%;
    }
    input:checked + .slider { background-color: #00adb5; }
    input:checked + .slider:before { transform: translateX(26px); }
  </style>
</head>
<body>

  <div class="container">
    
    <div class="panel">
      <h2>Ficha de Gestión de Cobranza</h2>
      
      <div class="form-group">
        <label>Nombre del Cliente</label>
        <input type="text" id="cli-nombre" readonly placeholder="Esperando cliente...">
      </div>
      
      <div class="form-group">
        <label>Teléfono</label>
        <input type="text" id="cli-telefono" readonly placeholder="Sin número">
      </div>
      
      <button class="btn btn-call" onclick="iniciarLlamadaManual()">📞 Realizar Llamada (Click-to-Call)</button>
      
      <div class="historial-panel">
        <h3 style="font-size: 16px; border-bottom: none; padding-bottom: 0; margin-bottom: 5px;">Historial de Llamadas Previas</h3>
        <table class="historial-table">
          <thead>
            <tr>
              <th>Fecha/Hora</th>
              <th>Resultado</th>
              <th>Compromiso</th>
            </tr>
          </thead>
          <tbody id="lista-historial">
            <tr>
              <td colspan="3" style="color: #aaa; text-align: center;">Sin llamadas previas registradas.</td>
            </tr>
          </tbody>
        </table>
      </div>

      <div id="cajon-disposicion" class="cajon-tipificacion" style="display: none;">
        <h3>Tipificar Resultado de Llamada</h3>
        
        <div class="form-group">
          <label>Resultado / Estado:</label>
          <select id="select-tipificacion" onchange="cambioTipificacion()">
            <option value="">-- Seleccione una opción --</option>
            <option value="PROMESA">Promesa de Pago</option>
            <option value="NO_CONTESTA">No Contesta</option>
            <option value="REHUSADO">Rehusado (No desea pagar)</option>
            <option value="EQUIVOCADO">Número Equivocado</option>
          </select>
        </div>

        <div id="campo-fecha-compromiso" class="form-group" style="display: none;">
          <label>Fecha de Compromiso de Pago:</label>
          <input type="date" id="input-fecha">
        </div>

        <button class="btn btn-save" onclick="enviarDisposicion()">💾 Guardar Gestión y Finalizar</button>
      </div>
    </div>

    <div>
      <div class="panel" style="margin-bottom: 20px;">
        <div class="flex-header">
          <h3 style="margin:0;">Marcador Automático</h3>
          <label class="switch">
            <input type="checkbox" id="toggle-discador" onchange="alterarMarcador(this.checked)">
            <span class="slider"></span>
          </label>
        </div>
        <p id="txt-estado-discador" style="font-size: 14px; color: #aaa; margin: 5px 0 0 0;">Estado: Desactivado (Manual)</p>
      </div>

      <div class="panel">
        <div class="flex-header">
          <h3 style="margin:0;">Estado de Agentes</h3>
          <button class="refresh-btn" onclick="cargarAgentes()" title="Refrescar ahora">🔄</button>
        </div>
        <div id="contenedor-agentes">
          <p style="color: #aaa; font-size: 14px;">Cargando agentes...</p>
        </div>
      </div>
    </div>

  </div>

  <script>
    const WORKER_URL = "https://mini-crm-cobranza-3cx.ursus006.workers.dev";
    let contactoActualId = null;

    window.addEventListener("DOMContentLoaded", () => {
      cargarAgentes();
      verificarToggle();
      obtenerSiguienteContacto();
      
      setInterval(cargarAgentes, 5000);
      setInterval(obtenerSiguienteContacto, 3000);
    });

    async function cargarAgentes() {
      try {
        const res = await fetch(`${WORKER_URL}/api/crm/agentes`);
        if (!res.ok) return;
        const agentes = await res.json();
        
        const contenedor = document.getElementById("contenedor-agentes");
        contenedor.innerHTML = "";
        
        agentes.forEach(a => {
          let badgeClass = "bg-offline";
          let estadoTexto = "Desconectado";
          
          if (a.conectado) {
            if (a.estado === "OnCall") { badgeClass = "bg-oncall"; estadoTexto = "En Llamada"; }
            else if (a.estado === "Available") { badgeClass = "bg-available"; estadoTexto = "Disponible"; }
            else if (a.estado === "Away") { badgeClass = "bg-away"; estadoTexto = "Ausente"; }
            else { badgeClass = "bg-available"; estadoTexto = a.estado; }
          }

          contenedor.innerHTML += `
            <div class="agent-item">
              <span><strong>Ext. ${a.extension}</strong> - ${a.nombre}</span>
              <span class="badge ${badgeClass}">${estadoTexto}</span>
            </div>
          `;
        });
      } catch (err) {
        console.error("Error cargando agentes:", err);
      }
    }

    // Traer contacto y renderizar su historial dinámicamente
    async function obtenerSiguienteContacto() {
      if (contactoActualId && document.getElementById("cajon-disposicion").style.display === "block") {
        return;
      }
      
      try {
        const res = await fetch(`${WORKER_URL}/api/crm/contactos`);
        if (!res.ok) return;
        const contactos = await res.json();
        
        if (contactos && contactos.length > 0) {
          const proxy = contactos[0];
          contactoActualId = proxy.id;
          document.getElementById("cli-nombre").value = proxy.nombre;
          document.getElementById("cli-telefono").value = proxy.telefono;

          // Pintar el historial recibido en la tabla
          const tbody = document.getElementById("lista-historial");
          tbody.innerHTML = "";

          if (proxy.historial && proxy.historial.length > 0) {
            proxy.historial.forEach(h => {
              const fechaCompromisoText = h.fecha_compromiso ? h.fecha_compromiso : "-";
              tbody.innerHTML += `
                <tr>
                  <td>${h.fecha}</td>
                  <td><span style="color:#00adb5; font-weight:bold;">${h.tipificacion}</span></td>
                  <td>${fechaCompromisoText}</td>
                </tr>
              `;
            });
          } else {
            tbody.innerHTML = `<tr><td colspan="3" style="color: #aaa; text-align: center;">Sin llamadas previas registradas.</td></tr>`;
          }
        }
      } catch (err) {
        console.error("Error al obtener contacto:", err);
      }
    }

    async function iniciarLlamadaManual() {
      const tel = document.getElementById("cli-telefono").value;
      if (!tel || !contactoActualId) {
        alert("No hay un número de cliente válido para marcar.");
        return;
      }
      
      mostrarCajonTipificacion();

      try {
        await fetch(`${WORKER_URL}/api/3cx/call?to=${tel}&id=${contactoActualId}`);
      } catch (err) {
        console.error("Error en Click-to-Call:", err);
      }
    }

    function mostrarCajonTipificacion() {
      document.getElementById("cajon-disposicion").style.display = "block";
    }

    function cambioTipificacion() {
      const valor = document.getElementById("select-tipificacion").value;
      const campoFecha = document.getElementById("campo-fecha-compromiso");
      
      if (valor === "PROMESA") {
        campoFecha.style.display = "block";
      } else {
        campoFecha.style.display = "none";
        document.getElementById("input-fecha").value = "";
      }
    }

    async function enviarDisposicion() {
      const tipificacion = document.getElementById("select-tipificacion").value;
      const fecha = document.getElementById("input-fecha").value;

      if (!tipificacion) {
        alert("Por favor, seleccione un resultado de llamada antes de guardar.");
        return;
      }
      if (tipificacion === "PROMESA" && !fecha) {
        alert("Debe seleccionar una fecha de compromiso para las Promesas de Pago.");
        return;
      }

      try {
        const res = await fetch(`${WORKER_URL}/api/crm/disponer`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            id: contactoActualId,
            tipificacion: tipificacion,
            fecha_compromiso: fecha
          })
        });

        if (res.ok) {
          alert("Gestión guardada exitosamente.");
          document.getElementById("cajon-disposicion").style.display = "none";
          document.getElementById("select-tipificacion").value = "";
          document.getElementById("input-fecha").value = "";
          contactoActualId = null;
          
          obtenerSiguienteContacto();
        } else {
          alert("Hubo un problema al guardar la gestión.");
        }
      } catch (err) {
        console.error("Error guardando disposición:", err);
      }
    }

    async function verificarToggle() {
      try {
        const res = await fetch(`${WORKER_URL}/api/crm/toggle`);
        if (!res.ok) return;
        const data = await res.json();
        const checkbox = document.getElementById("toggle-discador");
        const txt = document.getElementById("txt-estado-discador");
        
        checkbox.checked = data.activo === 1;
        txt.innerText = data.activo === 1 ? "Estado: Activo (Marcando...)" : "Estado: Desactivado (Manual)";
      } catch (err) {
        console.error("Error verificando toggle:", err);
      }
    }

    async function alterarMarcador(encendido) {
      const valor = encendido ? 1 : 0;
      const txt = document.getElementById("txt-estado-discador");
      txt.innerText = encendido ? "Estado: Activo (Marcando...)" : "Estado: Desactivado (Manual)";
      
      try {
        await fetch(`${WORKER_URL}/api/crm/toggle`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ activo: valor })
        });
      } catch (err) {
        console.error("Error actualizando toggle:", err);
      }
    }
  </script>
</body>
</html>
