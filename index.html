<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRM Cobranzas NXAI</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .customer-card {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            width: 350px;
            text-align: center;
        }
        .customer-card h2 {
            margin: 0 0 0.5rem 0;
            color: #333;
        }
        .debt-amount {
            font-size: 2rem;
            color: #e74c3c;
            font-weight: bold;
            margin: 1rem 0;
        }
        .info-group {
            margin-bottom: 1.5rem;
            text-align: left;
            border-bottom: 1px solid #eee;
            padding-bottom: 0.5rem;
        }
        .info-label {
            font-size: 0.8rem;
            color: #888;
            text-transform: uppercase;
        }
        .info-value {
            font-size: 1.1rem;
            color: #444;
            display: block;
        }
        .btn-call {
            background-color: #2ecc71;
            color: white;
            border: none;
            padding: 1rem 2rem;
            border-radius: 50px;
            font-size: 1rem;
            cursor: pointer;
            width: 100%;
            transition: background 0.3s ease;
            font-weight: bold;
        }
        .btn-call:hover {
            background-color: #27ae60;
        }
        .btn-call:disabled {
            background-color: #bdc3c7;
            cursor: not-allowed;
        }
        #status-msg {
            margin-top: 1rem;
            font-size: 0.9rem;
            color: #666;
        }
    </style>
</head>
<body>

<div class="customer-card">
    <div class="info-group">
        <span class="info-label">Cliente</span>
        <span class="info-value">John Maldonado</span>
    </div>

    <div class="info-group">
        <span class="info-label">Monto Adeudado</span>
        <div class="debt-amount">S/ 1,250.00</div>
    </div>

    <div class="info-group">
        <span class="info-label">Teléfono</span>
        <span class="info-value" id="phone-number">957665935</span>
    </div>

    <button class="btn-call" onclick="makeCall()" id="call-btn">
        📞 LLAMAR
    </button>

    <div id="status-msg"></div>
</div>

<script>
    async function makeCall() {
        const btn = document.getElementById('call-btn');
        const status = document.getElementById('status-msg');
        const phone = document.getElementById('phone-number').innerText;
        
        // URL de tu Worker de Cloudflare
        const workerUrl = `https://mini-crm-cobranza-3cx.ursus006.workers.dev/api/3cx/call?to=${phone}`;

        btn.disabled = true;
        btn.innerText = 'CONECTANDO...';
        status.innerText = 'Iniciando llamada en tu Softphone...';

        try {
            const response = await fetch(workerUrl);
            const data = await response.json();

            if (response.ok) {
                status.style.color = '#27ae60';
                status.innerText = '✔ Llamada enviada al Softphone.';
            } else {
                throw new Error(data.error || 'Error en el servidor');
            }
        } catch (error) {
            status.style.color = '#e74c3c';
            status.innerText = '❌ Error: ' + error.message;
        } finally {
            setTimeout(() => {
                btn.disabled = false;
                btn.innerText = '📞 LLAMAR AHORA';
            }, 3000);
        }
    }
</script>

</body>
</html>
